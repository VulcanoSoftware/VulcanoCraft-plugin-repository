<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificatiecentrum - VulcanoCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../style.css" rel="stylesheet">
  </head>
  <body>
    <!-- Floating Background Elements -->
    <div class="floating-bg">
      <div class="floating-element el-1"></div>
      <div class="floating-element el-2"></div>
      <div class="floating-element el-3"></div>
      <div class="floating-element el-4"></div>
      <div class="floating-element el-5"></div>
    </div>

    <div class="container my-5">
      <header class="text-center mb-5 position-relative">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <a href="/" class="btn btn-outline-light header-nav-btn">
            <i class="fas fa-arrow-left me-1"></i> <span data-i18n="auth.back_to_home">Terug naar Home</span>
          </a>
          <h2 class="text-light fw-bold mb-0">
            <i class="fas fa-bell text-warning me-2"></i><span data-i18n="notifications.page_title">Notificatiecentrum</span>
          </h2>
          <div>
            <button class="btn btn-outline-danger btn-sm" id="clearAllNotificationsBtn">
              <i class="fas fa-trash-alt me-1"></i> <span data-i18n="notifications.clear_all">Alles Wissen</span>
            </button>
          </div>
        </div>
        <p class="lead text-light opacity-75" data-i18n="notifications.page_subtitle">Bekijk alle updates en statusberichten over je plugins</p>
      </header>

      <!-- Filter Controls Bar -->
      <div class="card shadow-lg border-0 mb-4 dark-glass-card">
        <div class="card-body p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="btn-group" role="group" id="notifFilterGroup">
            <button type="button" class="btn btn-outline-light active" data-filter="all" id="filterNotifAll">
              <i class="fas fa-list me-1"></i> <span data-i18n="notifications.filter_all">Alle</span>
            </button>
            <button type="button" class="btn btn-outline-light" data-filter="unread" id="filterNotifUnread">
              <i class="fas fa-envelope me-1"></i> <span data-i18n="notifications.filter_unread">Ongelezen</span>
            </button>
          </div>
          <div class="text-light fs-6">
            <span class="badge bg-warning text-dark fs-6 me-2" id="unreadNotifCountBadge">0 ongelezen</span>
            <span class="badge bg-secondary fs-6" id="totalNotifCountBadge">0 totaal</span>
          </div>
        </div>
      </div>

      <!-- Notifications List Container -->
      <div id="notificationsContainer">
        <div class="text-center text-light py-5">
          <div class="spinner-border text-info mb-3" role="status"></div>
          <p data-i18n="common.loading">Laden...</p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../js/app/notifications.js"></script>
  </body>
</html>
